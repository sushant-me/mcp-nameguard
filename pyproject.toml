[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-nameguard"
version = "0.4.2"
description = "Check an MCP server's tool names against the names agent frameworks put on the wire themselves"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "ai-agents", "tool-poisoning", "security", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]

[project.scripts]
mcp-nameguard = "nameguard.cli:main"

[tool.setuptools]
packages = ["nameguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
